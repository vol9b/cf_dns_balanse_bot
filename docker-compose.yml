services:
  cf-dns-bot:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: cf-dns-bot
    env_file:
      - .env
    environment:
      - CF_DB_PATH=/data/cf_dns.db
      - PYTHONUNBUFFERED=1
    volumes:
      - cf-dns-bot-data:/data
      - cf-dns-bot-logs:/var/log/cf-dns-bot
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      # heartbeat обновляется основным циклом проверки (bot.py:_beat).
      # Старше 120с → цикл завис → unhealthy.
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(cat /data/heartbeat 2>/dev/null || echo 0) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Для отладки можно раскомментировать:
    # command: python bot.py --once
    # Для тестирования без DNS изменений:
    # command: python bot.py --no-manage-dns

volumes:
  cf-dns-bot-data:
    driver: local
  cf-dns-bot-logs:
    driver: local

